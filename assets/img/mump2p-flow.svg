<text x="20" y="24" font-size="10" text-anchor="start" fill="#4de3ff">PUBLISH</text><rect x="12" y="34" width="82" height="44" rx="8" fill="#4de3ff" fill-opacity="0.12" stroke="#4de3ff" stroke-opacity=".8"/><text x="53.0" y="55.0" font-size="10" text-anchor="middle">Thông điệp</text><text x="53.0" y="67.0" font-size="8" text-anchor="middle" class="m">length prefix + pad</text><path d="M95 56L106 56" stroke="#4de3ff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#ac)"/><rect x="108" y="34" width="82" height="44" rx="8" fill="#4de3ff" fill-opacity="0.12" stroke="#4de3ff" stroke-opacity=".8"/><text x="149.0" y="55.0" font-size="10" text-anchor="middle">Chia k mảnh</text><text x="149.0" y="67.0" font-size="8" text-anchor="middle" class="m">ShredFactor</text><path d="M191 56L202 56" stroke="#4de3ff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#ac)"/><rect x="204" y="34" width="82" height="44" rx="8" fill="#4de3ff" fill-opacity="0.12" stroke="#4de3ff" stroke-opacity=".8"/><text x="245.0" y="55.0" font-size="10" text-anchor="middle">Tạo shard</text><text x="245.0" y="67.0" font-size="8" text-anchor="middle" class="m">× Multiplier</text><path d="M287 56L298 56" stroke="#4de3ff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#ac)"/><rect x="300" y="34" width="82" height="44" rx="8" fill="#4de3ff" fill-opacity="0.12" stroke="#4de3ff" stroke-opacity=".8"/><text x="341.0" y="55.0" font-size="10" text-anchor="middle">Gửi peer</text><text x="341.0" y="67.0" font-size="8" text-anchor="middle" class="m">vòng tròn</text><circle r="2.5" fill="#fff" filter="url(#gl)"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M12 56L388 56"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle><text x="20" y="124" font-size="10" text-anchor="start" fill="#b28cff">NHẬN SHARD</text><rect x="12" y="134" width="82" height="44" rx="8" fill="#b28cff" fill-opacity="0.12" stroke="#b28cff" stroke-opacity=".8"/><text x="53.0" y="155.0" font-size="10" text-anchor="middle">Kiểm tra</text><text x="53.0" y="167.0" font-size="8" text-anchor="middle" class="m">độc lập tuyến tính</text><path d="M95 156L106 156" stroke="#b28cff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#av)"/><rect x="108" y="134" width="82" height="44" rx="8" fill="#b28cff" fill-opacity="0.12" stroke="#b28cff" stroke-opacity=".8"/><text x="149.0" y="155.0" font-size="10" text-anchor="middle">Lưu shard</text><text x="149.0" y="167.0" font-size="8" text-anchor="middle" class="m">bỏ shard thừa</text><path d="M191 156L202 156" stroke="#b28cff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#av)"/><rect x="204" y="134" width="82" height="44" rx="8" fill="#b28cff" fill-opacity="0.12" stroke="#b28cff" stroke-opacity=".8"/><text x="245.0" y="155.0" font-size="10" text-anchor="middle">Recode</text><text x="245.0" y="167.0" font-size="8" text-anchor="middle" class="m">> Threshold</text><path d="M287 156L298 156" stroke="#b28cff" stroke-width="1.5" fill="none" opacity="0.8" marker-end="url(#av)"/><rect x="300" y="134" width="82" height="44" rx="8" fill="#b28cff" fill-opacity="0.12" stroke="#b28cff" stroke-opacity=".8"/><text x="341.0" y="155.0" font-size="10" text-anchor="middle">Giải mã</text><text x="341.0" y="167.0" font-size="8" text-anchor="middle" class="m">khi đủ k</text><circle r="2.5" fill="#fff" filter="url(#gl)"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M12 156L388 156"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle><text x="200" y="210" font-size="9.5" text-anchor="middle" class="m">Shard từ publisher → chuyển ngay cho mọi mesh peer</text><text x="200" y="226" font-size="9.5" text-anchor="middle" class="m">Shard từ peer → recode, chuyển tiếp khi vượt ForwardShardThreshold</text>

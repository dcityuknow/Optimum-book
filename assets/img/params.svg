<text x="20" y="20" font-size="10" text-anchor="start" fill="#9aa3c8">1 thông điệp</text><rect x="20" y="26" width="360" height="26" rx="6" fill="#4de3ff" fill-opacity=".15" stroke="#4de3ff"/><rect x="24" y="30" width="83" height="18" rx="4" fill="#ff7ab8" fill-opacity=".5"/><text x="65" y="43" font-size="9" text-anchor="middle">mảnh 1</text><rect x="113" y="30" width="83" height="18" rx="4" fill="#6aa8ff" fill-opacity=".5"/><text x="154" y="43" font-size="9" text-anchor="middle">mảnh 2</text><rect x="202" y="30" width="83" height="18" rx="4" fill="#ffd34d" fill-opacity=".5"/><text x="243" y="43" font-size="9" text-anchor="middle">mảnh 3</text><rect x="291" y="30" width="83" height="18" rx="4" fill="#4dffb0" fill-opacity=".5"/><text x="332" y="43" font-size="9" text-anchor="middle">mảnh 4</text><text x="200" y="70" font-size="9.5" text-anchor="middle" fill="#4de3ff">↓ ShredFactor = số mảnh gốc</text><text x="20" y="92" font-size="9.5" text-anchor="start" fill="#9aa3c8">shard đã mã hoá (ShredFactor × PublisherShardMultiplier)</text><rect x="20" y="100" width="39" height="26" rx="6" fill="#ff7ab8" fill-opacity=".35" stroke="#ff7ab8"/><text x="39.5" y="117" font-size="10" text-anchor="middle">s1</text><rect x="65" y="100" width="39" height="26" rx="6" fill="#6aa8ff" fill-opacity=".35" stroke="#6aa8ff"/><text x="84.5" y="117" font-size="10" text-anchor="middle">s2</text><rect x="110" y="100" width="39" height="26" rx="6" fill="#ffd34d" fill-opacity=".35" stroke="#ffd34d"/><text x="129.5" y="117" font-size="10" text-anchor="middle">s3</text><rect x="155" y="100" width="39" height="26" rx="6" fill="#4dffb0" fill-opacity=".35" stroke="#4dffb0"/><text x="174.5" y="117" font-size="10" text-anchor="middle">s4</text><rect x="200" y="100" width="39" height="26" rx="6" fill="#ff7ab8" fill-opacity=".35" stroke="#ff7ab8"/><text x="219.5" y="117" font-size="10" text-anchor="middle">s5</text><rect x="245" y="100" width="39" height="26" rx="6" fill="#6aa8ff" fill-opacity=".35" stroke="#6aa8ff"/><text x="264.5" y="117" font-size="10" text-anchor="middle">s6</text><rect x="290" y="100" width="39" height="26" rx="6" fill="#ffd34d" fill-opacity=".35" stroke="#ffd34d"/><text x="309.5" y="117" font-size="10" text-anchor="middle">s7</text><rect x="335" y="100" width="39" height="26" rx="6" fill="#4dffb0" fill-opacity=".35" stroke="#4dffb0"/><text x="354.5" y="117" font-size="10" text-anchor="middle">s8</text><circle r="2.6" fill="#fff" filter="url(#gl)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M20 113L380 113"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3s" begin="0s" repeatCount="indefinite"/></circle><text x="20" y="156" font-size="9.5" text-anchor="start" fill="#ffc857">ForwardShardThreshold</text><rect x="20" y="164" width="360" height="12" rx="6" fill="#fff" fill-opacity=".08"/><rect x="20" y="164" width="150" height="12" rx="6" fill="#ffc857" fill-opacity=".85"><animate attributeName="width" values="20;360;360;20" keyTimes="0;.7;.9;1" dur="5s" repeatCount="indefinite"/></rect><path d="M240 158L240 182" stroke="#ff5d73" stroke-width="1.6" fill="none" opacity="0.8" stroke-dasharray="3 2"/><text x="110" y="196" font-size="9" text-anchor="middle" class="m">dưới ngưỡng: chỉ nhận</text><text x="310" y="196" font-size="9" text-anchor="middle" fill="#4dffb0">vượt ngưỡng: recode + chuyển tiếp</text><text x="240" y="210" font-size="9" text-anchor="middle" fill="#ff5d73">ngưỡng = ShredFactor × Threshold</text><text x="200" y="229" font-size="9" text-anchor="middle" class="m">tinh chỉnh theo điều kiện mạng</text>
</svg>